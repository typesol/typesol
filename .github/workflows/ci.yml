name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # run by macos.yml with another runner
    inputs:
      os:
        description: JSON list of runner labels for the test matrix
        type: string
        default: '["ubuntu-latest"]'
      differential:
        description: Run the Anchor differential job ("yes" or "no")
        type: string
        default: "yes"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Pushes and pull requests test on Ubuntu; macOS runs daily from macos.yml (its runners are often unavailable,
        # and a cancelled job marks the commit as failed).
        os: ${{ fromJSON(inputs.os || '["ubuntu-latest"]') }}
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Cache Agave CLI and platform-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: agave-3.1.10-tools-${{ runner.os }}
      - name: Install Agave CLI
        run: |
          [ -x ~/.local/share/solana/install/active_release/bin/solana ] || sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install platform-tools (the clang TypeSOL compiles with)
        run: |
          sdk=~/.local/share/solana/install/active_release/bin/platform-tools-sdk/sbf
          # Pinned (the version Agave 3.1.10 uses), with retries: the download can fail transiently.
          for i in 1 2 3 4; do
            [ -x "$sdk/dependencies/platform-tools/llvm/bin/clang" ] && break
            cargo-build-sbf --install-only --tools-version v1.52 || sleep $((i * 15))
          done
          "$sdk/dependencies/platform-tools/llvm/bin/clang" --version | head -1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint # scripts/ typecheck against dist/
      - name: Cache third-party program binaries
        uses: actions/cache@v4
        with:
          path: test/programs/mpl_*.so
          key: programs-v1
      - name: Fetch program binaries (public devnet, with retries)
        run: for i in 1 2 3; do bash scripts/fetch-programs.sh devnet && break; sleep 20; done
      - run: pnpm test
      - name: Pack, install the tarball into a scaffolded project, typecheck and test it
        run: |
          npm pack --pack-destination /tmp
          mkdir /tmp/consumer && cd /tmp/consumer && npm init -y >/dev/null
          npm install /tmp/typesol-*.tgz
          npx typesol --version
          npx typesol init app --name app && cd app
          npm pkg set devDependencies.typesol=file:$(ls /tmp/typesol-*.tgz)
          npm install
          npx typesol build
          npx tsc -p tsconfig.json
          npm test

  differential:
    # A string, not a boolean: GitHub compares a missing input (null) as equal to false, which would skip this job on
    # pushes and pull requests.
    if: ${{ inputs.differential != 'no' }}
    # The Anchor twins (bench/anchor) make test/differential.test.ts and the cpigen Anchor test run instead of skip.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Agave CLI, platform-tools and cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
            ~/.cargo/registry
            bench/anchor/target
          key: differential-agave-3.1.10-${{ hashFiles('bench/anchor/Cargo.lock') }}
      - run: |
          [ -x ~/.local/share/solana/install/active_release/bin/solana ] || sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm bench:anchor
      - run: FUZZ_RUNS=500 FUZZ_STEPS=300 pnpm vitest run test/differential.test.ts test/cpigen.test.ts
