name: release
# Publishes a tagged version to npm. Started by hand only (Actions → release → Run workflow): tags and GitHub Releases
# never publish on their own. It builds and tests the tag, then publishes; publishing needs the "npm" environment's NPM_TOKEN.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the v (the tag v<version> must exist)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    # Self-contained and without caches: it runs on a tag chosen by hand, so nothing it builds may reach a cache that
    # other workflows read.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a version: $VERSION"; exit 1; }'
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install Agave CLI and platform-tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          for i in 1 2 3 4; do cargo-build-sbf --install-only --tools-version v1.52 && break; sleep $((i * 15)); done
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json
        env:
          VERSION: ${{ inputs.version }}
        run: test "$(node -p 'require("./package.json").version')" = "$VERSION"
      - run: pnpm build
      - run: pnpm lint
      - name: Fetch program binaries (public devnet, with retries)
        run: for i in 1 2 3; do bash scripts/fetch-programs.sh devnet && break; sleep 20; done
      - run: pnpm test
      - run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
