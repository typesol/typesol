name: release
# Publishes a tagged version to npm as @typesol/cli. Started by hand only (Actions → release → Run workflow): tags and
# GitHub Releases never publish on their own. It builds and tests the tag, then publishes through npm trusted publishing
# (OIDC: npm trusts this workflow in the "npm" environment of typesol/typesol), so no npm token is stored anywhere.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the v (the tag v<version> must exist)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    # Self-contained and without caches: it runs on a tag chosen by hand, so nothing it builds may reach a cache that
    # other workflows read.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a version: $VERSION"; exit 1; }'
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no caches in the publishing job (see above)
      - name: npm with trusted publishing (11.5.1 or later)
        run: npm install -g npm@11.21.1 && npm --version
      - name: Install Agave CLI and platform-tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          for i in 1 2 3 4; do cargo-build-sbf --install-only --tools-version v1.52 && break; sleep $((i * 15)); done
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json
        env:
          VERSION: ${{ inputs.version }}
        run: test "$(node -p 'require("./package.json").version')" = "$VERSION"
      - name: CHANGELOG has this version
        env:
          VERSION: ${{ inputs.version }}
        run: grep -qE "^## ${VERSION//./\\.} — [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || { echo "CHANGELOG.md has no '## $VERSION — <date>' section"; exit 1; }
      - run: pnpm build
      - run: pnpm lint
      - name: Fetch program binaries (public devnet, with retries)
        run: for i in 1 2 3; do bash scripts/fetch-programs.sh devnet && break; sleep 20; done
      - run: pnpm test
      - run: npm publish --provenance --access public --ignore-scripts

  # What a user gets: the published package from the registry, a project from each template, its own test.
  installed:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        template: [counter, vault, escrow]
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Agave CLI and platform-tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          for i in 1 2 3 4; do cargo-build-sbf --install-only --tools-version v1.52 && break; sleep $((i * 15)); done
      - name: Wait for the registry
        env:
          VERSION: ${{ inputs.version }}
        run: for i in $(seq 1 20); do [ "$(npm view "@typesol/cli@$VERSION" version 2>/dev/null)" = "$VERSION" ] && exit 0; sleep 15; done; exit 1
      - name: latest points at this version
        env:
          VERSION: ${{ inputs.version }}
        run: test "$(npm view @typesol/cli dist-tags.latest)" = "$VERSION"
      - name: init, install, test
        env:
          VERSION: ${{ inputs.version }}
          TEMPLATE: ${{ matrix.template }}
        run: |
          cd "$RUNNER_TEMP"
          npx -y "@typesol/cli@$VERSION" init app --template "$TEMPLATE"
          cd app
          npm install --no-audit --no-fund
          test "$(node -p 'require("typesol/package.json").version')" = "$VERSION"
          npm run typecheck
          npm run build
          npm test
