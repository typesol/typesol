name: release
# Publishes a tagged version to npm. Started by hand only (Actions → release → Run workflow): tags and GitHub Releases
# never publish on their own. The full CI runs on the tag first; publishing needs the "npm" environment's NPM_TOKEN.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the v (the tag v<version> must exist)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: v${{ inputs.version }}

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json
        run: test "$(node -p 'require("./package.json").version')" = "${{ inputs.version }}"
      - run: pnpm build
      - run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
