  <text x="456" y="125" class="name">Pinocchio</text>
  <rect x="560" y="112" width="220" height="18" rx="4" fill="#21262d"/>
  <rect x="560" y="112" width="32.0" height="18" rx="4" fill="#6e7681"/>
