  <rect x="104" y="78" width="220" height="18" rx="4" fill="#21262d"/>
  <rect x="104" y="78" width="39.5" height="18" rx="4" fill="url(#brand)"/>
  <text x="336" y="91" class="num ours">18%</text>
  <text x="0" y="125" class="name">Pinocchio</text>
  <rect x="104" y="112" width="220" height="18" rx="4" fill="#21262d"/>
  <rect x="104" y="112" width="48.8" height="18" rx="4" fill="#6e7681"/>
  <text x="336" y="125" class="num">22%</text>
  <text x="0" y="159" class="name">Native Rust</text>
  <rect x="104" y="146" width="220" height="18" rx="4" fill="#21262d"/>
  <rect x="104" y="146" width="121.9" height="18" rx="4" fill="#6e7681"/>
