<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="TypeSOL benchmark summary: counter, vault, escrow · 9 instructions · fewer compute units than Pinocchio on 9 of 9">
  <title>TypeSOL benchmark summary</title>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3178C6"/><stop offset="0.55" stop-color="#9945FF"/><stop offset="1" stop-color="#14F195"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #9198a1; font-size: 13px; }
      .title { fill: #e6edf3; font-size: 15px; font-weight: 600; }
      .note { font-size: 12px; }
      .name.ours, .num.ours { fill: #e6edf3; font-weight: 600; }
      .num { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
      .caption { font-size: 12px; }
    </style>
  </defs>
  <text x="0" y="28" class="title">Compute units</text>
